<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gloss — your files</title>
  <meta name="description" content="gloss in your browser: open your own images, documents, and meshes in a visual terminal pager. Nothing is uploaded.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23A7D7B1%27/%3E%3Ctext x=%2732%27 y=%2747%27 text-anchor=%27middle%27 font-size=%2752%27 fill=%27%233F3080%27%3E%E2%96%A7%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="app.wasm" as="fetch" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="./" title="About gloss">gloss<span>▧</span></a>
    <div class="actions">
      <button id="open-files" type="button">Open files…</button>
      <button id="open-folder" type="button">Open folder…</button>
    </div>
    <div class="library"><span id="library">Nothing kept yet</span><button id="forget" type="button" hidden title="Remove every kept file from this browser">Forget all</button></div>
    <span class="assurance" title="Files are read by your browser and shown by gloss running in it. They are kept in this browser's storage for this site, and nowhere else.">Nothing is uploaded</span>
  </header>
  <div id="notice" role="status" hidden></div>
  <main>
    <div id="terminal" aria-label="Interactive terminal"></div>
    <div id="status" role="status">Loading gloss…</div>
    <div id="drop" role="status" hidden>Drop files to open</div>
  </main>
  <script type="application/json" id="gloss-boot">{"mode":"app"}</script>
  <script src="wasm_exec.js"></script>
  <script type="module" src="runtime.js"></script>
</body></html>
