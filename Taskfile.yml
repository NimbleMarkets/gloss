version: '3'

vars:
  VERSION: '{{default "dev" .VERSION}}'

tasks:
  default:
    cmds: [task: build]
  list:
    desc: List available tasks
    cmds: [task --list]
  build:
    desc: Build ./gloss
    env:
      GLOSS_VERSION: '{{.VERSION}}'
    cmds:
      - go build -mod=readonly -trimpath -ldflags "-X main.version=$GLOSS_VERSION" -o gloss ./cmd/gloss
  run:
    desc: Run gloss (pass arguments after --)
    cmds: ['go run ./cmd/gloss {{.CLI_ARGS}}']
  install:
    desc: Install gloss into the Go bin directory
    cmds: [go install -mod=readonly ./cmd/gloss]
  fmt:
    desc: Format Go sources
    cmds: [gofmt -w cmd internal examples scripts/gen-assets]
  fmt-check:
    desc: Check Go formatting
    cmds:
      - 'test -z "$(gofmt -l cmd internal examples scripts/gen-assets)"'
  go-tidy:
    desc: Tidy module dependencies
    cmds: [go mod tidy]
  go-tidy-check:
    cmds: [go mod tidy -diff]
  go-verify:
    cmds: [go mod verify]
  test:
    desc: Run tests
    cmds: [go test -mod=readonly ./...]
  test-race:
    desc: Run tests with race detection
    cmds: [go test -mod=readonly -race ./...]
  vet:
    desc: Run Go static checks
    cmds: [go vet -mod=readonly ./...]
  ci:
    desc: Run the same checks as GitHub Actions
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: test-race
      - task: vet
      - task: build
      - task: notices-check
      - task: docs-check
  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the modules linked
    cmds: ['go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md']
  notices-check:
    desc: Fail when THIRD_PARTY_NOTICES.md is not what the modules linked say
    cmds:
      - 'go run ./internal/tools/notices | cmp -s - THIRD_PARTY_NOTICES.md || (echo "THIRD_PARTY_NOTICES.md is stale: run task notices" >&2; exit 1)'
  release:
    desc: Package a snapshot release into dist with GoReleaser, publishing nothing
    cmds: [goreleaser release --snapshot --clean]
  release-check:
    desc: Check the GoReleaser configuration
    cmds: [goreleaser check]
  demo:
    desc: Run the embedded sample gallery in your terminal
    dir: examples/demo
    cmds: ['go run . {{.CLI_ARGS}}']
  demo-check:
    desc: Check the browser demo module
    dir: examples/demo
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go test -mod=readonly ./...
      - go vet -mod=readonly ./...
  build-wasm-site:
    desc: Build the self-contained sample gallery site into web/dist
    cmds: [sh scripts/build-site.sh]
  web-check:
    desc: Test download progress and demo navigation (Node 18+)
    cmds: ['node --test web/*.test.mjs']
  serve-wasm-site:
    desc: Build and serve the demo at http://localhost:8000
    deps: [build-wasm-site]
    cmds: [python3 -m http.server 8000 --directory web/dist --bind 127.0.0.1]
  docs:
    desc: Generate the man page and the documentation pages (see docs:hugo:serve)
    cmds:
      - task: docs:man:build
      - task: docs:md:build
  docs:man:build:
    desc: Generate the gloss(1) man page into docs/man
    sources:
      - cmd/gloss/*.go
      - internal/document/*.go
      - go.mod
      - go.sum
    generates:
      - docs/man/gloss.1
    cmds: [go run ./cmd/gloss --docs-man docs/man]
  docs:md:build:
    desc: Generate the command reference, and the guide pages made from DEVELOP.md and the skill
    sources:
      - cmd/gloss/*.go
      - internal/document/*.go
      - internal/tools/docsite/*.go
      - DEVELOP.md
      - skills/gloss/SKILL.md
      - go.mod
      - go.sum
    generates:
      - docs/hugo/content/command/_index.md
      - docs/hugo/content/guide/development.md
      - docs/hugo/content/guide/for-llms.md
    cmds:
      - go run ./cmd/gloss --docs-markdown docs/hugo/content/command --docs-hugo
      - go run ./internal/tools/docsite -o docs/hugo/content/guide
  docs:hugo:serve:
    desc: Serve the documentation site while editing it (needs hugo, extended)
    deps: [docs:md:build]
    dir: docs/hugo
    cmds: [hugo serve]
  docs:hugo:build:
    desc: Build the documentation site into docs/hugo/public (pass hugo flags after --)
    deps: [docs:md:build]
    dir: docs/hugo
    cmds: ['hugo --minify {{.CLI_ARGS}}']
  docs:clean:
    desc: Remove what the docs tasks generate
    cmds: [rm -rf docs/man docs/hugo/content/command docs/hugo/content/guide/development.md docs/hugo/content/guide/for-llms.md docs/hugo/public docs/hugo/resources]
  docs-check:
    desc: Check that the man page and the reference can be generated from the options
    cmds:
      - 'dir="$(mktemp -d)" && go run ./cmd/gloss --docs-man "$dir/man" --docs-markdown "$dir/md" --docs-hugo && go run ./internal/tools/docsite -o "$dir/guide"; status=$?; rm -rf "$dir"; exit $status'
  gen-assets:
    desc: Regenerate the original PNG, HEIC, PDF, and Grist fixtures
    cmds:
      - go run ./scripts/gen-assets
      - python3 scripts/gen-grist.py
