name: Fuzz
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time to fuzz each target
        default: 60s
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz the loaders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.x'
      - name: Fuzz each target
        run: task fuzz FUZZTIME="${{ inputs.fuzztime || '60s' }}"
      # A crash is written under testdata/fuzz as a seed that reproduces it.
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashers
          path: internal/document/testdata/fuzz
          if-no-files-found: ignore
