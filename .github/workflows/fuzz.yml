name: Fuzz
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time to fuzz each target
        default: 60s
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz the loaders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Each target runs on its own, as go test -fuzz requires; a failure
      # does not stop the others, and fails the job at the end.
      - name: Fuzz each target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
        run: |
          failed=0
          for target in $(grep -ho '^func Fuzz[A-Za-z0-9_]*' internal/document/fuzz_test.go | cut -d' ' -f2); do
            echo "::group::$target"
            go test ./internal/document -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" || failed=1
            echo "::endgroup::"
          done
          exit $failed
      # A crash is written under testdata/fuzz as a seed that reproduces it.
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers
          path: internal/document/testdata/fuzz
          if-no-files-found: ignore
