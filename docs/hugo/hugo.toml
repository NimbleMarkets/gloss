baseURL = "https://nimblemarkets.github.io/gloss/docs/"
title = "gloss"
theme = "hugo-book"
contentDir = "content"

# Disable auto-generated timestamps for reproducible builds
enableGitInfo = false

[params]
  description = "A visual pager for the terminal: like less, for images, PDFs, meshes, and documents"

  # hugo-book theme params
  BookTheme = "auto"
  # The table of contents takes a column of the page. The theme lets a page
  # turn it off but not on, so it is on here, and pages too short to want
  # one say bookToC: false in their front matter.
  BookToC = true
  BookSection = "*"
  BookRepo = "https://github.com/NimbleMarkets/gloss"
  BookEditPath = "edit/main/docs/hugo"
  BookDateFormat = "January 2, 2006"
  BookSearch = true
  BookComments = false

# The fonts are the landing page's: one copy, mounted into the site.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../../web/fonts"
    target = "static/fonts"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
